name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'pnpm-lock.yaml', '.github/workflows/api.yml']
  pull_request:
    paths: ['apps/api/**', 'pnpm-lock.yaml', '.github/workflows/api.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api build
      - run: pnpm test:api
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/lash_test
